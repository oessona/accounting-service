openapi: 3.0.3
info:
  title: Accounting Service API
  description: REST API for user authentication, accounts, transactions, dashboard, reports, and admin management.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: Auth
  - name: Dashboard
  - name: Accounts
  - name: Transactions
  - name: Reports
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          example: user

    Account:
      type: object
      properties:
        id:
          type: integer
        account_type:
          type: string
        balance:
          type: number
          format: float

    Transaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          format: float
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        status:
          type: string
          enum: [processing, done, failed]
        transaction_date:
          type: string
          format: date

security:
  - bearerAuth: []

paths:

  /test:
    get:
      summary: API health check
      responses:
        200:
          description: API is working

  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        201:
          description: User registered successfully

  /login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
        422:
          description: Invalid credentials

  /logout:
    post:
      tags: [Auth]
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        200:
          description: Dashboard data returned

  /accounts:
    get:
      tags: [Accounts]
      summary: Get user accounts
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of accounts
    post:
      tags: [Accounts]
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_type:
                  type: string
      responses:
        201:
          description: Account created

  /accounts/{id}:
    put:
      tags: [Accounts]
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Account updated
    delete:
      tags: [Accounts]
      summary: Delete account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Account deleted

  /transactions:
    get:
      tags: [Transactions]
      summary: Get all transactions
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of transactions
    post:
      tags: [Transactions]
      summary: Create transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        201:
          description: Transaction created

  /transactions/{id}:
    put:
      tags: [Transactions]
      summary: Update transaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Transaction updated
    delete:
      tags: [Transactions]
      summary: Delete transaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Transaction deleted

  /transactions/stats/today:
    get:
      tags: [Transactions]
      summary: Get today's transaction statistics
      security:
        - bearerAuth: []
      responses:
        200:
          description: Daily stats returned

  /reports/summary:
    get:
      tags: [Reports]
      summary: Get financial summary report
      security:
        - bearerAuth: []
      responses:
        200:
          description: Summary report

  /reports/transactions:
    get:
      tags: [Reports]
      summary: Get all transactions report
      security:
        - bearerAuth: []
      responses:
        200:
          description: Transactions report

  /admin/users:
    get:
      tags: [Admin]
      summary: Get all users (admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: User list returned

  /admin/users/{id}:
    delete:
      tags: [Admin]
      summary: Delete user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User deleted

  /admin/activity:
    get:
      tags: [Admin]
      summary: Get system activity (admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Activity data returned
